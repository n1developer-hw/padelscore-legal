<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <title>404 — Page not found | PadelScore</title>
  <meta name="theme-color" content="#0b0f14" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0f14;
      --panel: rgba(255,255,255,.06);
      --panel-2: rgba(255,255,255,.08);
      --text: #e9eef5;
      --muted: #aab6c5;
      --border: rgba(255,255,255,.14);
      --brand: #8ab4f8;
      --brand-2: #5eead4;
      --shadow: 0 16px 50px rgba(0,0,0,.45);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --panel: #f6f8fa;
        --panel-2: #eef2f6;
        --text: #0b0f14;
        --muted: #4a5568;
        --border: #e6e6e6;
        --brand: #1457ff;
        --brand-2: #0ea5e9;
        --shadow: 0 16px 50px rgba(0,0,0,.12);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.55;
      background: var(--bg);
      color: var(--text);
    }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 18px 64px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: .2px;
      color: var(--text);
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: radial-gradient(120% 120% at 10% 10%, var(--brand-2), var(--brand));
      box-shadow: var(--shadow);
    }
    nav {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      white-space: nowrap;
    }
    .btn:hover {
      transform: translateY(-1px);
      background: var(--panel-2);
      border-color: color-mix(in srgb, var(--border) 70%, var(--brand) 30%);
      text-decoration: none;
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border-color: transparent;
      color: #071018;
      font-weight: 700;
    }

    .card {
      margin-top: 12px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 80%, transparent), transparent);
      border-radius: 22px;
      padding: 28px 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .card:before {
      content: "";
      position: absolute;
      inset: -2px;
      background: radial-gradient(700px 300px at 20% 0%, color-mix(in srgb, var(--brand) 25%, transparent), transparent),
                  radial-gradient(800px 380px at 85% 15%, color-mix(in srgb, var(--brand-2) 18%, transparent), transparent);
      pointer-events: none;
      opacity: .85;
    }
    .inner { position: relative; }
    .kicker {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      color: var(--muted);
      font-size: 13px;
      width: fit-content;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 40px;
      line-height: 1.12;
      letter-spacing: -0.6px;
    }
    @media (max-width: 520px) { h1 { font-size: 32px; } }
    p { margin: 0; color: var(--muted); max-width: 70ch; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    footer {
      margin-top: 46px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .footer-links { display: flex; gap: 14px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="./index.html" aria-label="PadelScore home">
        <img src="assets/logo.svg" alt="PadelScore" width="46" height="46" style="border-radius:12px;box-shadow:var(--shadow);" />
        <span>PadelScore</span>
      </a>
      <nav aria-label="Primary">
        <a class="btn" href="./index.html">Home</a>
        <a class="btn" href="./privacy-policy.html">Privacy Policy</a>
      </nav>
    </div>

    <main class="card" aria-label="404">
      <div class="inner">
        <div class="kicker">
          <span aria-hidden="true">404</span>
          <span>Page not found</span>
        </div>
        <h1>Oops — this page doesn’t exist.</h1>
        <p>
          The link may be outdated, or the address might be mistyped. Use the buttons below to get back on track.
        </p>
        <div class="actions">
          <a class="btn primary" href="./index.html">Go to home</a>
          <a class="btn" href="./privacy-policy.html">Privacy Policy</a>
        </div>
      </div>
    </main>

    <footer>
      <div>PadelScore © 2026</div>
      <div class="footer-links">
        <a href="./index.html">Home</a>
        <a href="./privacy-policy.html">Privacy Policy</a>
      </div>
    </footer>
  </div>
</body>
</html>
